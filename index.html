<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PALBOX — Redirection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0f0f1a;
      color: #e8eaf6;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
      text-align: center;
    }
    .icon { font-size: 64px; }
    h1 { font-size: 22px; font-weight: 700; }
    p { color: #8892b0; font-size: 14px; max-width: 280px; line-height: 1.6; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #2d2d4e;
      border-top-color: #00d4aa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      margin-top: 10px;
      background: linear-gradient(135deg, #00d4aa, #00a882);
      color: #001a14;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="icon">📦</div>
  <h1>PALBOX Stock</h1>
  <div class="spinner"></div>
  <p>Redirection vers l'application en cours...</p>
  <a class="btn" id="fallback-btn" href="#" style="display:none">Ouvrir l'application →</a>

  <script>
    // ⚠️ REMPLACER PAR L'URL DE VOTRE WEB APP GOOGLE
    const APP_URL = "https://script.google.com/macros/s/AKfycbw7Z78JqQgqTxbwzzO93h2KrlE00uYsDyNQ_KtIdtHOl95a3P5O9bU_iU17FK-YA4F_/exec";

    // Redirection immédiate
    window.location.href = APP_URL;

    // Bouton de secours si la redirection ne fonctionne pas (2 secondes)
    setTimeout(() => {
      document.querySelector('.spinner').style.display = 'none';
      document.querySelector('p').textContent = 'Cliquer ci-dessous si vous n\'êtes pas redirigé automatiquement.';
      const btn = document.getElementById('fallback-btn');
      btn.href = APP_URL;
      btn.style.display = 'inline-block';
    }, 2000);
  </script>
</body>
</html>
